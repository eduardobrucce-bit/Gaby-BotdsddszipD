kind = "web"
previewPath = "/"
title = "Chat Page"
version = "1.0.0"
id = "artifacts/chat-page"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24237

[services.development]
run = "pnpm --filter @workspace/chat-page run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/chat-page", "run", "build" ]
publicDir = "artifacts/chat-page/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24237"
BASE_PATH = "/"
